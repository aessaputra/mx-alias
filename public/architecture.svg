<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">MX Alias architecture</title>
  <desc id="diagram-desc">Browser uses the MX Alias Next.js app. The app reads and writes aliases through the MXroute API. An OIDC provider can optionally handle login.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4f5d75"/>
    </marker>
    <style>
      .node { fill: #f5f5f5; stroke: #bfc0c0; stroke-width: 1.5; }
      .focal { fill: #fdf4ef; stroke: #eb6c36; }
      .name { font: 600 18px system-ui, sans-serif; fill: #2d3142; }
      .detail { font: 13px ui-monospace, monospace; fill: #4f5d75; }
      .flow { fill: none; stroke: #4f5d75; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="380" rx="16" fill="#ececec"/>
  <path class="flow" d="M248 170H344"/>
  <path class="flow" d="M616 170H696"/>
  <path class="flow" stroke-dasharray="5 5" d="M480 220V270"/>
  <rect class="node" x="48" y="120" width="200" height="100" rx="10"/>
  <text class="name" x="148" y="178" text-anchor="middle">Browser</text>
  <rect class="node focal" x="344" y="120" width="272" height="100" rx="10"/>
  <text class="name" x="480" y="164" text-anchor="middle">MX Alias</text>
  <text class="detail" x="480" y="190" text-anchor="middle">Next.js app</text>
  <rect class="node" x="696" y="120" width="216" height="100" rx="10"/>
  <text class="name" x="804" y="164" text-anchor="middle">MXroute API</text>
  <text class="detail" x="804" y="190" text-anchor="middle">Alias source of truth</text>
  <rect class="node" x="372" y="270" width="216" height="68" rx="10"/>
  <text class="name" x="480" y="299" text-anchor="middle">OIDC provider</text>
  <text class="detail" x="480" y="322" text-anchor="middle">Optional login</text>
</svg>
